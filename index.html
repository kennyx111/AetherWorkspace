<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskAether - Task Flow & Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;600&family=Courier+Prime&family=Georgia&family=Impact&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="workspace.css">
</head>
<body>
    <div class="workspace-layout" id="workspace-layout">
        <!-- Navigation Rail Sidebar -->
        <aside class="sidebar left-rail" id="rail-sidebar">
            <div class="rail-menu">
                <div class="logo">
                    <div class="glass-icon brand-logo">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <span class="sidebar-text logo-text">TaskAether</span>
                </div>
                
                <a href="index.html" class="rail-item" title="Inbox">
                    <div class="glass-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-6l-2 3h-4l-2-3H2v6a2 2 0 002 2h16a2 2 0 002-2v-6z"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
                    </div>
                    <span class="sidebar-text">Inbox</span>
                    <span class="rail-badge sidebar-text" id="inbox-count-badge">0</span>
                </a>
                
                <a href="#" class="rail-item active" title="Workspace">
                    <div class="glass-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg>
                    </div>
                    <span class="sidebar-text">Workspace</span>
                </a>

                <!-- Rail Settings Menu Item Directly Below Workspace -->
                <div class="rail-settings-wrapper">
                    <button class="rail-item settings-btn" id="rail-settings-btn" title="Settings">
                        <div class="glass-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </div>
                        <span class="sidebar-text">Settings</span>
                    </button>

                    <div class="settings-dropdown-menu" id="settings-dropdown-menu">
                        <div class="menu-header-title">Settings</div>
                        <button class="settings-opt-btn" id="opt-display-mode">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            <span>Display Mode</span>
                        </button>
                        <button class="settings-opt-btn" id="opt-theme">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                            <span>Theme</span>
                        </button>
                        <div class="menu-divider"></div>
                        <button class="settings-opt-btn danger" id="opt-signout">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom Collapse Button -->
            <button class="sidebar-collapse-btn bottom-btn" id="toggle-rail-btn" title="Collapse TaskAether Rail">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                <span class="collapse-btn-text">Collapse Rail</span>
            </button>
            <div class="sidebar-resizer" data-sidebar="rail-sidebar"></div>
        </aside>

        <!-- Tasks Sidebar -->
        <section class="sidebar inbox-panel" id="inbox-sidebar">
            <div class="panel-header">
                <h2>Tasks</h2>
                <button class="add-task-btn" id="open-add-task-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>Add Task</span>
                </button>
            </div>
            
            <div class="task-list" id="inbox-task-list"></div>

            <!-- Bottom Collapse Button -->
            <button class="sidebar-collapse-btn bottom-btn" id="toggle-inbox-btn" title="Collapse Tasks">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                <span class="collapse-btn-text">Collapse Tasks</span>
            </button>
            <div class="sidebar-resizer" data-sidebar="inbox-sidebar"></div>
        </section>

        <!-- Auto-Hiding Left Edge Uncollapse Zone -->
        <div class="left-uncollapse-zone" id="left-uncollapse-zone">
            <div class="uncollapse-buttons-stack">
                <button class="pull-sidebar-btn hidden" id="uncollapse-inbox-btn" title="Pull Tasks">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                    <span>Tasks</span>
                </button>
                <button class="pull-sidebar-btn hidden" id="uncollapse-rail-btn" title="Pull TaskAether Rail">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                    <span>TaskAether Rail</span>
                </button>
            </div>
        </div>

        <!-- Main Workspace Canvas Area -->
        <main class="canvas-area" id="canvas-container">
            <canvas id="freehand-canvas"></canvas>

            <svg id="connection-layer">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
                    </marker>
                </defs>
            </svg>

            <!-- Auto-Hiding Bottom Floating Control Toolbar -->
            <div class="bottom-toolbar-trigger-zone" id="bottom-toolbar-trigger-zone">
                <div class="bottom-toolbar" id="bottom-toolbar">
                    <button class="tool-btn active-mode" id="select-tool-btn" title="Select & Drag Mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
                    </button>
                    <button class="tool-btn" id="pencil-tool-btn" title="Pencil / Freehand Draw">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </button>
                    <button class="tool-btn" id="eraser-tool-btn" title="Eraser Tool">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L21 6C22 7 22 9 21 10L12 19L20 20Z"/><path d="M18 11l-5-5"/></svg>
                    </button>
                    
                    <div class="tool-group-wrapper">
                        <button class="tool-btn" id="text-tool-btn" title="Add Text Box">
                            <span style="font-weight:800; font-size:1.1rem; line-height:1;">T</span>
                        </button>
                        <select id="global-font-selector" class="font-dropdown-picker" title="Select Font Type">
                            <option value="'Plus Jakarta Sans', sans-serif">Jakarta Sans</option>
                            <option value="'Inter', sans-serif">Inter</option>
                            <option value="'Georgia', serif">Georgia</option>
                            <option value="'Courier Prime', monospace">Courier</option>
                            <option value="'Impact', sans-serif">Impact</option>
                        </select>
                    </div>
                    
                    <div class="shape-tool-wrapper">
                        <button class="tool-btn" id="shape-tool-btn" title="Choose Shapes Tool">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><circle cx="17.5" cy="6.5" r="3.5"/><path d="M3 21l7-10 7 10H3z"/></svg>
                        </button>
                        <div class="shapes-popup-menu" id="shapes-popup-menu">
                            <div class="menu-label">Draw Shape (Click & Drag Canvas)</div>
                            <div class="shape-options-grid">
                                <button class="shape-opt-btn selected" data-shape="rectangle" title="Rectangle">▭</button>
                                <button class="shape-opt-btn" data-shape="square" title="Square">▢</button>
                                <button class="shape-opt-btn" data-shape="triangle" title="Triangle">△</button>
                                <button class="shape-opt-btn" data-shape="line" title="Straight Line">╱</button>
                                <button class="shape-opt-btn" data-shape="curved-line" title="Curved Line">〜</button>
                            </div>
                            <div class="menu-label" style="margin-top: 8px;">Outline Color Spectrum</div>
                            <input type="color" id="shape-color-picker" class="spectrum-picker-btn" value="#38bdf8" />
                        </div>
                    </div>

                    <div class="toolbar-divider"></div>
                    <button class="tool-btn" id="quick-add-card-btn" title="Create New Task">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="tool-btn danger" id="delete-selected-btn" title="Delete Selected Entity">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Arrow Context Menu -->
    <div id="arrow-color-context" class="context-color-menu">
        <label>Arrow Color Spectrum</label>
        <div class="color-palette-row">
            <button class="color-dot" data-color="#818cf8" style="background:#818cf8;"></button>
            <button class="color-dot" data-color="#38bdf8" style="background:#38bdf8;"></button>
            <button class="color-dot" data-color="#4ade80" style="background:#4ade80;"></button>
            <button class="color-dot" data-color="#facc15" style="background:#facc15;"></button>
            <button class="color-dot" data-color="#f43f5e" style="background:#f43f5e;"></button>
        </div>
        <input type="color" id="arrow-custom-color" class="spectrum-picker-btn" value="#818cf8" title="Custom Spectrum Color">
    </div>

    <!-- Glassmorphic Modal -->
    <div class="modal-backdrop" id="task-modal-backdrop">
        <div class="glass-modal">
            <div class="modal-header">
                <h3 id="modal-heading">Create Task</h3>
                <button class="modal-close-btn" id="close-modal-btn">&times;</button>
            </div>
            
            <div class="modal-body">
                <form class="modal-form" id="task-editor-form" onsubmit="return false;">
                    <div class="form-group">
                        <label>Task Name (Optional)</label>
                        <input type="text" id="task-input-title" placeholder="e.g. Build authentication system" />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Icon</label>
                            <div class="icon-picker-grid" id="icon-picker"></div>
                        </div>

                        <div class="form-group">
                            <label>Accent Spectrum Color</label>
                            <div class="spectrum-picker-container">
                                <input type="color" id="task-spectrum-color" class="spectrum-picker-btn" value="#a78bfa" />
                                <span class="spectrum-hex-label" id="spectrum-hex-label">#a78bfa</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Tag Label (Optional)</label>
                            <input type="text" id="task-input-label" placeholder="e.g. Engineering, Discovery" />
                        </div>
                        <div class="form-group">
                            <label>Due Date / Timeline (Text Field)</label>
                            <input type="text" id="task-input-date" placeholder="e.g. Tomorrow, Oct 24, ASAP" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Notes / Description (Optional)</label>
                        <textarea id="task-input-notes" rows="2" placeholder="Implementation details..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Comments</label>
                        <div class="comments-list" id="task-comments-list"></div>
                        <div class="comment-input-row">
                            <input type="text" id="task-input-comment" placeholder="Add a comment..." />
                            <button type="button" class="btn-secondary" id="add-comment-btn">Add</button>
                        </div>
                    </div>
                </form>

                <div class="preview-section">
                    <label class="preview-label">Live Preview</label>
                    <div class="preview-card-container">
                        <div class="task-card-element" id="live-card-preview">
                            <div class="card-header">
                                <div class="card-icon-box" id="preview-icon-box">
                                    <span id="preview-icon-svg"></span>
                                </div>
                                <span class="card-title-text" id="preview-title">Task Title</span>
                            </div>
                            <p class="card-notes-text" id="preview-notes">Notes preview will show here...</p>
                            <div class="card-footer-meta">
                                <span class="card-tag-pill" id="preview-tag">Label</span>
                                <span class="card-date-pill" id="preview-date"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancel-modal-btn">Cancel</button>
                <button class="btn-primary" id="save-task-btn">Save Task</button>
            </div>
        </div>
    </div>

    <script src="workspace.js"></script>
</body>
</html>
